name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example v0.1.0)"
        required: true

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish the APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/yomikae.jks"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build the release APKs
        run: ./gradlew assembleRelease
        env:
          storeFile: ${{ runner.temp }}/yomikae.jks
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename the APKs
        run: |
          set -e
          T=${{ steps.tag.outputs.tag }}
          mv app/build/outputs/apk/release/app-universal-release.apk Yomikae-$T.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk Yomikae-arm64-v8a-$T.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk Yomikae-armeabi-v7a-$T.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk Yomikae-x86_64-$T.apk

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Yomikae ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            Yomikae-${{ steps.tag.outputs.tag }}.apk
            Yomikae-arm64-v8a-${{ steps.tag.outputs.tag }}.apk
            Yomikae-armeabi-v7a-${{ steps.tag.outputs.tag }}.apk
            Yomikae-x86_64-${{ steps.tag.outputs.tag }}.apk
