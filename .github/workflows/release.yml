name: Release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (for example v0.1.0)"
        required: true

env:
  MIHON_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish the APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/yomikae.jks"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build the release APKs
        run: ./gradlew assembleRelease
        env:
          storeFile: ${{ runner.temp }}/yomikae.jks
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Two files only, named for people rather than for processors. The arm64 one keeps the
      # "-arm64-v8a" marker that the in-app updater looks for; the universal one has no marker,
      # which the updater takes as the fallback. 32-bit and x86_64 builds are not published:
      # the on-device translation engine (LiteRT-LM) does not exist for 32-bit phones.
      - name: Rename the APKs
        run: |
          set -e
          T=${{ steps.tag.outputs.tag }}
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk Yomikae-$T-arm64-v8a.apk
          mv app/build/outputs/apk/release/app-universal-release.apk Yomikae-$T-autres-appareils.apk
          sed "s/TAG/$T/g" .github/release-notes.md > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          T=${{ steps.tag.outputs.tag }}
          gh release delete "$T" --yes 2>/dev/null || true
          gh release create "$T" --title "Yomikae $T" --notes-file notes.md --generate-notes             "Yomikae-$T-arm64-v8a.apk#Yomikae-$T-arm64-v8a.apk — Android phones & tablets · téléphones et tablettes (99 %)"             "Yomikae-$T-autres-appareils.apk#Yomikae-$T-autres-appareils.apk — Chromebook, emulator · émulateur, x86"
